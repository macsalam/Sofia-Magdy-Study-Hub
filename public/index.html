<!doctype html>
<html lang="en" data-hub-notes="own">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sofia Magdy Study Hub</title>
<meta name="theme-color" content="#262143">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='16' fill='%23262143'/%3E%3Cellipse cx='17' cy='18' rx='13' ry='4' fill='none' stroke='%235FD4F4' stroke-width='2' transform='rotate(-18 17 18)'/%3E%3Ccircle cx='17' cy='17' r='6' fill='%23FFD36E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/hub.css">
<style>
:root{--display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--r:22px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:radial-gradient(ellipse 70% 55% at 8% 0%,color-mix(in srgb,var(--glow1) 40%,transparent),transparent 70%),
   radial-gradient(ellipse 60% 50% at 100% 30%,color-mix(in srgb,var(--glow2) 30%,transparent),transparent 70%);
  background-attachment:fixed;transition:background-color .35s,color .35s}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:12px}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topin{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:21px;min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--ink2)}
.spacer{flex:1}
.hero{padding:26px 0 8px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--kick);font-weight:800;margin:0}
.hero h1{font-size:clamp(30px,5.4vw,52px);font-weight:800;letter-spacing:-.02em;margin:8px 0 10px}
.hero p{color:var(--ink2);max-width:62ch}
main{padding-bottom:120px}
footer{color:var(--ink2);font-size:13px;padding:26px 0 40px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="topin">
  <div class="brand">
    <svg width="48" height="48" viewBox="0 0 34 34" aria-hidden="true"><ellipse cx="17" cy="18" rx="15" ry="4.5" fill="none" stroke="var(--acc2)" stroke-width="1.8" transform="rotate(-18 17 18)"/><circle cx="17" cy="17" r="7" fill="var(--acc)"/><circle cx="28" cy="9" r="1.6" fill="var(--sun)"/></svg>
    <div>Sofia Magdy Study Hub<small>Cambridge Lower Secondary · Stage 9</small></div>
  </div>
  <div class="spacer"></div>
  <div id="hubControlsHost"></div>
</div></div></header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">Your study space</p>
    <h1>Pick a subject and keep going</h1>
    <p>Progress, stickers, notes and your study plan are saved to the hub, so they follow you to any device.</p>
  </section>
  <div class="hub-home" id="homeRows"></div>
  <footer>Sofia Magdy Study Hub · private study space</footer>
</main>

<script>
window.HubPage={render(){
 const H=window.Hub,esc=H.esc;
 const rows=document.getElementById('homeRows');
 const t=H.today();
 function card(lbl,big,sub,extra,bar){
  return `<div class="hub-card"><span class="lbl">${lbl}</span><div class="big">${big}</div>${sub?`<div class="sub">${sub}</div>`:''}
   ${extra||''}${bar!=null?`<div class="hbar"><i style="width:${bar}%"></i></div>`:''}</div>`;
 }
 function row(c){
  const sum=H.sumOf(c.id);
  const pct=sum&&sum.total?Math.round(sum.done/sum.total*100):0;
  const prog=c.live
   ? card('Progress',pct+'%',sum&&sum.total?`${sum.done} of ${sum.total} steps finished`:'No steps finished yet','',pct)
   : card('Progress','Not started','This hub is still being built','',0);
  const last=sum&&sum.last
   ? card('Last studied',esc(sum.last.label),sum.lastAt?('on '+esc(H.fmtDay(sum.lastAt))):'',
      `<a class="hub-btn cta" style="align-self:flex-start;margin-top:10px;text-decoration:none" href="${c.href||'#'}">Continue</a>`)
   : card('Last studied','Nothing yet',c.live?'Open the hub to make a start':'Coming soon');
  const sess=H.PLAN.sessions.filter(s=>s.cur===c.id&&s.date===t).sort((a,b)=>a.from.localeCompare(b.from));
  const next=H.upcoming().filter(s=>s.cur===c.id)[0];
  const planBody=sess.length
   ? `<div class="hub-mini" style="margin-top:8px">${sess.map(s=>`<div class="hub-sess" style="--c:${c.c}"><b>${esc(s.from)}–${esc(s.to)}</b>${esc(s.label)}</div>`).join('')}</div>`
   : `<div class="hub-mini" style="margin-top:8px">${next?`<div class="hub-sess" style="--c:${c.c}"><b>${esc(H.fmtDay(next.date))} · ${esc(next.from)}</b>${esc(next.label)}</div>`:''}
      <button class="hub-btn" style="align-self:flex-start;margin-top:6px" data-plan>Build your plan</button></div>`;
  const plan=`<div class="hub-card"><span class="lbl">Today's plan</span><div class="big">${sess.length?sess.length+(sess.length===1?' session':' sessions'):'Nothing today'}</div>${planBody}</div>`;
  const cardEl=c.live
   ? `<a class="hub-curr" href="${c.href}"><span class="ico">${c.icon}</span><h2>${esc(c.name)}</h2><p>${esc(c.blurb)}</p><span class="go">Open <span aria-hidden="true">→</span></span></a>`
   : `<div class="hub-curr" aria-disabled="true"><span class="ico">${c.icon}</span><h2>${esc(c.name)}</h2><p>${esc(c.blurb)}</p><span class="soon">Coming soon</span></div>`;
  return `<div class="hub-row">${cardEl}<div class="hub-sub">${prog}${last}${plan}</div></div>`;
 }
 rows.innerHTML=H.CURRICULA.map(row).join('');
 if(!rows.dataset.wired){rows.dataset.wired='1';rows.addEventListener('click',e=>{if(e.target.closest('[data-plan]'))H.openPlan();});}
}};
document.addEventListener('hubplan',()=>window.HubPage.render());
document.addEventListener('hubtheme',()=>{});
</script>
<script src="/assets/sync.js" data-app="/assets/hub.js"></script>
</body>
</html>
